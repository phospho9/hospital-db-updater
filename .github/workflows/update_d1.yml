name: Update D1 Hospital Database

on:
  schedule:
    # 💡 6시간마다 자동 실행 (한국시간 03시, 09시, 15시, 21시 / 하루 총 4,000건 갱신)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 관리자가 [Run workflow] 버튼으로 수동 실행 가능

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests xmltodict

      - name: Run collector script
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          python collector.py
