name: Update D1 Hospital Database

on:
  schedule:
    # 💡 [핵심 절감 1] 실행 횟수 축소
    # 기존: 6시간마다 하루 4회 ('0 */6 * * *')
    # 변경: 3일에 1회 실행 ('0 18 */3 * *' -> KST 기준 3일마다 새벽 03시 실행)
    - cron: '0 18 */3 * *'
  workflow_dispatch: # 관리자가 [Run workflow] 버튼으로 수동 실행 가능

# 💡 [핵심 절감 2] 중복 실행 자동 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # 💡 [핵심 절감 3] pip 패키지 캐싱
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests xmltodict

      - name: Run collector script
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          python collector.py
